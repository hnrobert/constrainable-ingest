# SRS config for Constrainable Ingest.
# Variables ($CANDIDATE, $APP_HOST, $APP_PORT) are substituted by an entrypoint
# wrapper; with the stock ossrs/srs image you may instead hardcode them or use
# the image's SRS_* env templating. Defaults below assume the compose network.
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;      # allow browser API/WHEP calls (flv.js, WHEP)
}
http_server {
    enabled         on;
    listen          8080;
    crossdomain     on;      # allow flv.js to fetch the .flv URL cross-origin
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;   # browser-reachable IP (set to LAN/public IP)
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://$BACKEND/api/srs/on_publish;
        on_unpublish    http://$BACKEND/api/srs/on_unpublish;
    }

    # Generous publisher timeouts: slow-starting encoders (e.g. a 1-FPS OBS
    # canvas can take ~30s to emit the first media packet after publish) must
    # survive. Defaults are firstpkt=20s / normal=5s, which killed such streams.
    publish {
        firstpkt_timeout    120000;
        normal_timeout      60000;
    }

    # HTTP-FLV live pull for the admin/viewer players
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }

    # Optional WebRTC playback (RTMP<->RTC bridge)
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }

    play {
        gop_cache       on;
        queue_length    10;
    }
}
