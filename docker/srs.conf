# SRS config for Constrainable Ingest.
# Variables ($CANDIDATE, $APP_HOST, $APP_PORT) are substituted by an entrypoint
# wrapper; with the stock ossrs/srs image you may instead hardcode them or use
# the image's SRS_* env templating. Defaults below assume the compose network.
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;      # allow browser API/WHEP calls (flv.js, WHEP)
}
http_server {
    enabled         on;
    listen          8080;
    crossdomain     on;      # allow flv.js to fetch the .flv URL cross-origin
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;   # browser-reachable IP (set to LAN/public IP)
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://app:3000/api/srs/on_publish;
        on_unpublish    http://app:3000/api/srs/on_unpublish;
    }

    # HTTP-FLV live pull for the admin/viewer players
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }

    # Optional WebRTC playback (RTMP<->RTC bridge)
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }

    play {
        gop_cache       on;
        queue_length    10;
    }
}
