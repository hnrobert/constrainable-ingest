# Dev override: expose SRS ports on the host so the host-run media-node
# (go run ./media-node, owning dev :1935) and dev app (bun run dev) can reach it.
# The base compose runs SRS as "srs-media" (paired with the Go media-node).
#
#   bun run compose:up:srs      # start SRS with host port mappings
#   bun run gateway              # start media-node on host :1935
#   bun run dev                  # start the Node app on :31954
#
# Port remaps avoid conflicts with other dev tools that squat :1935/:8080.
services:
  srs-media:
    ports:
      - "11935:1935"   # SRS RTMP, remapped off 1935 so the dev media-node can own :1935
      - "1985:1985"   # HTTP API
      - "18080:8080"   # HTTP-FLV, remapped off 8080 (host :8080 often taken)
      - "8000:8000/udp" # WebRTC
