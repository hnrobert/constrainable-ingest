# Single-machine intranet deployment: app + SRS, no reverse proxy, no TLS.
#
# Network model:
#   - The two containers talk to each other over an ISOLATED bridge network
#     (`ingest`) using compose service names + container ports — never the host
#     ports/localhost. app → http://srs:1985 (API) and rtmp://srs/... (pull);
#     srs → http://app:3000/api/srs/* (http_hooks).
#   - Host ports below are published ONLY for things that live OUTSIDE the
#     containers: the browser (app :3000, which also serves Socket.IO at
#     /socket.io/, and SRS FLV :8080 / WHEP :1985) and OBS (RTMP :1935).
#     PUBLIC_HOST is the browser-visible host IP for playback URLs — it is NOT
#     used for inter-container traffic.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: constrainable-ingest:latest
    container_name: ingest-app
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      # storage
      DB_PATH: /app/data/app.db
      RECORD_DIR: /app/records
      # SRS endpoints (server-to-server via compose service name, NOT host ports)
      SRS_API_BASE: http://srs:1985/api/v1
      SRS_RTMP_HOST: srs
      # browser-visible host (LAN/public IP) for playback URLs
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      # binaries (installed in the image)
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      # auth
      SESSION_SECRET: ${SESSION_SECRET:-changeme-change-me}
    volumes:
      - ../data:/app/data
      - ../records:/app/records
    ports:
      - "3000:3000"   # app + Socket.IO (same origin, /socket.io/)
    networks:
      - ingest
    depends_on:
      - srs
    restart: unless-stopped

  srs:
    image: ossrs/srs:7
    container_name: ingest-srs
    entrypoint: ["/bin/sh", "/srs-entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # browser-reachable IP for WebRTC ICE candidate (the host's LAN/public IP)
      SRS_RTC_CANDIDATE: ${PUBLIC_HOST:-127.0.0.1}
    volumes:
      - ./srs.conf:/srs.conf.template:ro
      - ./srs-entrypoint.sh:/srs-entrypoint.sh:ro
    ports:
      - "1935:1935"   # RTMP ingest (OBS)
      - "1985:1985"   # HTTP API + WHEP (browser)
      - "8080:8080"   # HTTP-FLV / HLS playback (browser)
      - "8000:8000/udp" # WebRTC (optional)
    networks:
      - ingest
    restart: unless-stopped

networks:
  ingest:
    driver: bridge
