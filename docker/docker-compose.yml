# Full-stack compose: frontend (static) + backend (API) + Go media-node + SRS.
# Each service can be selectively started via the compose:up:* scripts —
# see package.json. All services share the `ingest` network and communicate
# by service name (never host ports).
#
# Service topology:
#   server     (Nuxt API + auth + Socket.IO + admin)  → the control plane
#   media-node (Go RTMP front-door, ~8MB)             → connects to server via Socket.IO
#   srs-media  (SRS with DVR recording, ~142MB)       → colocated with media-node
services:

  # ── Backend: Nuxt API server (no SRS needed to run) ──
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: constrainable-ingest-server:latest
    container_name: ingest-server
    environment:
      HOST: 0.0.0.0
      PORT: "31954"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      DB_PATH: /app/data/app.db
      RECORD_DIR: /app/records
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      SESSION_SECRET: ${SESSION_SECRET:-changeme-change-me}
      AUTHMOD_VERIFIER_SECRET: ${AUTHMOD_VERIFIER_SECRET:-change-me-to-a-long-random-string}
      # MEDIA_NODE_AUTH_TOKEN: ${MEDIA_NODE_AUTH_TOKEN:-}  # empty = no auth
    volumes:
      - ../data:/app/data
      - ../records:/app/records
    networks:
      - ingest
    restart: unless-stopped

  # ── Go media-node: RTMP ingest front-door (~8MB, no HTTP) ──
  media-node:
    build:
      context: ../media-node
      dockerfile: Dockerfile
    image: constrainable-media-node:latest
    container_name: ingest-media-node
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ORIGIN: http://server:31954
      SELF_ORIGIN: ${PUBLIC_HOST:-127.0.0.1}
      MEDIA_NODE_AUTH_TOKEN: ${MEDIA_NODE_AUTH_TOKEN:-}
      RTMP_PORT: "1935"
      SRS_ADDR: localhost:1935
      SRS_API_BASE: http://localhost:1985/api/v1
      RECORD_DIR: /records
      ALLOW_DIRECT_SRS: "false"
    volumes:
      - ./records-node:/records
    ports:
      - "1935:1935"
    networks:
      - ingest
    depends_on:
      - server

    restart: unless-stopped


networks:
  ingest:
    driver: bridge
