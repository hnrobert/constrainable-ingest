# ─────────────────────────────────────────────────────────────────
# Constrainable Ingest — Deployment Orchestrator
#
# This repo contains ONLY deployment configuration (compose + docs).
# Code lives in:
#   constrainable-app         → Nuxt frontend + backend (ghcr.io/OWNER/constrainable-app)
#   constrainable-media-node → Go RTMP + SRS (ghcr.io/OWNER/constrainable-media-node)
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#
# Replace OWNER with the GitHub user/org that owns the GHCR packages.
# ─────────────────────────────────────────────────────────────────

services:
  # ── Backend: Nuxt API + SSR frontend + Socket.IO ──
  server:
    image: ghcr.io/OWNER/constrainable-app:latest
    container_name: ingest-server
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOST: 0.0.0.0
      PORT: "31954"
      NODE_ENV: production
      DB_PATH: /app/data/app.db
      RECORD_DIR: /app/records
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      SESSION_SECRET: ${SESSION_SECRET:-changeme-change-me}
      AUTHMOD_VERIFIER_SECRET: ${AUTHMOD_VERIFIER_SECRET:-change-me-to-a-long-random-string}
      # MEDIA_NODE_AUTH_TOKEN: ${MEDIA_NODE_AUTH_TOKEN:-}  # empty = no auth
    volumes:
      - ./data:/app/data
      - ./records:/app/records
    ports:
      - "31954:31954"
    networks:
      - ingest
    restart: unless-stopped

  # ── Go media-node: RTMP front-door + colocated SRS (~10MB) ──
  media-node:
    image: ghcr.io/OWNER/constrainable-media-node:latest
    container_name: ingest-media-node
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ORIGIN: http://server:31954
      SELF_ORIGIN: ${PUBLIC_HOST:-127.0.0.1}
      MEDIA_NODE_AUTH_TOKEN: ${MEDIA_NODE_AUTH_TOKEN:-}
      RTMP_PORT: "1935"
      SRS_ADDR: localhost:1935
      SRS_API_BASE: http://localhost:1985/api/v1
      SRS_BIN: /usr/local/srs/objs/srs
      SRS_RTC_CANDIDATE: ${PUBLIC_HOST:-127.0.0.1}
      RECORD_DIR: /records
      ALLOW_DIRECT_SRS: "false"
    volumes:
      - ./records:/records
    ports:
      - "1935:1935"
      - "8080:8080"
    networks:
      - ingest
    depends_on:
      - server
    restart: unless-stopped

networks:
  ingest:
    driver: bridge
